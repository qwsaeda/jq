[package]
name = "junqi_rs"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
wgpu = { version = "30", default-features = false, features = ["std", "gles"] }
pollster = "0.3"
raw-window-handle = "0.6"
